name: workbench-tests

# workbench/ is excluded from the R package build (.Rbuildignore), so R CMD
# check never runs these. Playwright browser_*.mjs scenarios need a local
# browser and fixture projects and remain manual (see workbench/tests/TEST_PLAN.md).

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs only within the same PR and workflow. Main pushes,
# manual releases and tags have unique groups and are never cancelled here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages used by bridge-level tests
        shell: Rscript {0}
        run: install.packages(c("jsonlite", "digest"))
      - name: Python unit tests
        run: python -B -m unittest discover -s workbench/tests -p 'test_*.py' -v
      - name: Frozen report evaluator tests
        run: python -B -m unittest discover -s benchmark/evaluation-v1 -p 'test_*.py' -v
      - name: Node DOM tests
        run: |
          set -e
          for f in workbench/tests/test_*.mjs workbench/tests/*_dom.cjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
