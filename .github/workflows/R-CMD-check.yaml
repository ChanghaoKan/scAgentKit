name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Match the independently accepted modern classifier, rather than
          # silently moving to an unaudited Bioconductor patch release.
          # Build DelayedArray against this job's S4Arrays to avoid a stale
          # serialized re-export from a cached repository binary.
          extra-packages: |
            any::rcmdcheck
            github::bioc/scDblFinder@a712645413b638a956e80d87c82da92d6bc92394
            github::bioc/DelayedArray@63285a4ab9f3b74c894e5f709e9cde408fca78c0?reinstall&nocache
          needs: check
      - name: Verify audited dependency and clean namespace imports
        shell: Rscript {0}
        run: |
          stopifnot(identical(as.character(packageVersion("scDblFinder")), "1.26.7"))
          # Fail here on import warnings; do not hide them in the test suite.
          withCallingHandlers({
            stopifnot(requireNamespace("SummarizedExperiment", quietly = TRUE))
            stopifnot(requireNamespace("scDblFinder", quietly = TRUE))
          }, warning = function(w) stop(conditionMessage(w), call. = FALSE))
          stopifnot(identical(
            getExportedValue("S4Arrays", "makeNindexFromArrayViewport"),
            getExportedValue("DelayedArray", "makeNindexFromArrayViewport")))
      - name: Check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = "--no-manual",
            error_on = "warning",
            check_dir = "check"
          )
