name: installed-runtime-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'R/**'
      - 'inst/workbench/**'
      - 'tools/**'
      - 'configure*'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'benchmark/contracts/**'
      - 'benchmark/tests/**'
      - 'benchmark/fixtures/**'
      - '.github/workflows/installed-runtime-contract.yaml'

# Cancel superseded runs only within the same PR and workflow. Main pushes,
# manual releases and tags have unique groups and are never cancelled here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  older-doublet-pair:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          dependencies: '"hard"'
          extra-packages: |
            any::BiocManager
            any::remotes
            any::testthat
      - name: Install the exact older classifier pair in an isolated library
        shell: Rscript {0}
        run: |
          native_lib <- file.path(Sys.getenv("RUNNER_TEMP"), "older-doublet-library")
          dir.create(native_lib)
          .libPaths(c(native_lib, .libPaths()))
          options(timeout = max(1800, getOption("timeout", 60)), warn = 1L,
            repos = BiocManager::repositories(version = "3.21"))
          remotes::install_url("https://cran.r-project.org/src/contrib/Archive/xgboost/xgboost_1.7.11.1.tar.gz",
            lib = native_lib, dependencies = NA, upgrade = "never")
          remotes::install_url("https://bioconductor.org/packages/3.21/bioc/src/contrib/scDblFinder_1.22.0.tar.gz",
            lib = native_lib, dependencies = NA, upgrade = "never")
          stopifnot(as.character(packageVersion("scDblFinder")) == "1.22.0",
            as.character(packageVersion("xgboost")) == "1.7.11.1")
      - name: Install a temporary source copy and require genuine classifier acceptance
        shell: Rscript {0}
        run: |
          native_lib <- file.path(Sys.getenv("RUNNER_TEMP"), "older-doublet-library")
          .libPaths(c(native_lib, .libPaths()))
          source_copy <- file.path(Sys.getenv("RUNNER_TEMP"), "older-doublet-source")
          dir.create(source_copy)
          paths <- list.files(".", all.files = TRUE, no.. = TRUE, full.names = TRUE)
          stopifnot(all(file.copy(paths[basename(paths) != ".git"], source_copy, recursive = TRUE)))
          remotes::install_local(source_copy, lib = native_lib, dependencies = FALSE, upgrade = "never", build = FALSE)
          loadNamespace("scAgentKit")
          getFromNamespace(".sc_run_doublet_dependencies", "scAgentKit")()
          stopifnot(as.character(packageVersion("scDblFinder")) == "1.22.0",
            as.character(packageVersion("xgboost")) == "1.7.11.1")
          results <- testthat::test_file(file.path(source_copy, "tests/testthat/test-run-doublet-legacy.R"),
            package = "scAgentKit", load_package = "installed", load_helpers = FALSE,
            reporter = "summary", stop_on_failure = TRUE)
          summary <- as.data.frame(results)
          write.csv(summary[intersect(c("file", "test", "failed", "skipped", "error", "passed"), names(summary))],
            file.path(Sys.getenv("RUNNER_TEMP"), "older-doublet-tests.csv"), row.names = FALSE)
          stopifnot(!any(summary$skipped))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: older-doublet-pair
          path: ${{ runner.temp }}/older-doublet-tests.csv
          if-no-files-found: warn
  source-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SCAGENTKIT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          dependencies: '"hard"'
          extra-packages: |
            any::knitr
            any::remotes
      - name: Offline comparison contract controls
        run: python -B -m unittest discover -s benchmark/tests -v
      - name: Build archive and install into a new library
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/source-contract" "$RUNNER_TEMP/fresh-library"
          R CMD build --no-build-vignettes .
          archive=$(find . -maxdepth 1 -name 'scAgentKit_*.tar.gz' -print)
          test -n "$archive"
          cp "$archive" "$RUNNER_TEMP/source-contract/"
          SCAGENTKIT_ARCHIVE_SHA256=$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$archive")
          export SCAGENTKIT_ARCHIVE_SHA256
          # Same archive installation entry as README; dependencies were resolved above.
          Rscript -e 'remotes::install_local(commandArgs(TRUE)[1], lib=commandArgs(TRUE)[2], dependencies=FALSE, upgrade="never", build=FALSE)' "$archive" "$RUNNER_TEMP/fresh-library"
          cp benchmark/contracts/installed_package_smoke.R benchmark/contracts/installed_continue.py "$RUNNER_TEMP/source-contract/"
          # Hide the checkout so bundled R/Python/static resources must suffice.
          mv "$GITHUB_WORKSPACE" "${GITHUB_WORKSPACE}.hidden"
          trap 'mv "${GITHUB_WORKSPACE}.hidden" "$GITHUB_WORKSPACE"' EXIT
          cd "$RUNNER_TEMP/source-contract"
          Rscript installed_package_smoke.R "$RUNNER_TEMP/fresh-library" "$RUNNER_TEMP/installed-smoke.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-runtime-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/installed-smoke.json
            ${{ runner.temp }}/source-contract/scAgentKit_*.tar.gz
          if-no-files-found: warn
